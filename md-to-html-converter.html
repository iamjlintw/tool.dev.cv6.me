<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown + Mermaid → HTML 轉換器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'default' });
  window.__mermaid = mermaid;
</script>
<style>
  .drop-zone.dragover {
    border-color: #3b82f6;
    background-color: #eff6ff;
  }
  #preview-area img { max-width: 100%; }
  #preview-area table { border-collapse: collapse; width: 100%; }
  #preview-area th, #preview-area td { border: 1px solid #d1d5db; padding: 8px; }
  #preview-area th { background: #f3f4f6; }
  #preview-area pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
  #preview-area code { font-size: 0.9em; }
  #preview-area blockquote { border-left: 4px solid #d1d5db; padding-left: 16px; color: #6b7280; }
  #preview-area h1 { font-size: 2em; font-weight: 700; margin: 0.67em 0; border-bottom: 1px solid #d1d5db; padding-bottom: 0.3em; }
  #preview-area h2 { font-size: 1.5em; font-weight: 700; margin: 0.83em 0; border-bottom: 1px solid #d1d5db; padding-bottom: 0.3em; }
  #preview-area h3 { font-size: 1.25em; font-weight: 700; margin: 1em 0; }
  #preview-area ul, #preview-area ol { padding-left: 2em; margin: 1em 0; }
  #preview-area li { margin: 0.25em 0; }
  #preview-area p { margin: 1em 0; }
  #preview-area a { color: #2563eb; text-decoration: underline; }
  #preview-area hr { border: none; border-top: 1px solid #d1d5db; margin: 1.5em 0; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <h1 class="text-xl font-bold text-gray-800">Markdown + Mermaid → HTML 轉換器</h1>
    <div class="flex gap-3">
      <button id="btn-preview" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-medium">
        即時預覽
      </button>
      <button id="btn-export" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition text-sm font-medium">
        匯出 HTML
      </button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <!-- Input Section -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Left: Editor -->
    <div class="flex flex-col gap-4">
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col" style="min-height: 500px;">
        <div class="flex items-center justify-between px-4 py-3 bg-gray-50 border-b border-gray-200">
          <span class="text-sm font-semibold text-gray-600">Markdown 輸入</span>
          <button id="btn-clear" class="text-xs text-red-500 hover:text-red-700 font-medium">清除</button>
        </div>
        <textarea
          id="md-input"
          class="flex-1 w-full p-4 font-mono text-sm text-gray-800 resize-none focus:outline-none"
          placeholder="在此貼上 Markdown 內容，或拖曳 .md 檔案至下方區域..."
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Drop Zone -->
      <div
        id="drop-zone"
        class="drop-zone bg-white rounded-xl border-2 border-dashed border-gray-300 p-6 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition"
      >
        <input type="file" id="file-input" accept=".md,.markdown,.txt" class="hidden">
        <div class="text-gray-500">
          <svg class="mx-auto h-10 w-10 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
          <p class="text-sm font-medium">點擊選擇或拖曳 <code>.md</code> 檔案至此</p>
          <p id="file-name" class="text-xs text-blue-600 mt-1 hidden"></p>
        </div>
      </div>
    </div>

    <!-- Right: Preview -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col" style="min-height: 500px;">
      <div class="px-4 py-3 bg-gray-50 border-b border-gray-200">
        <span class="text-sm font-semibold text-gray-600">即時預覽</span>
      </div>
      <div id="preview-area" class="flex-1 p-6 overflow-auto prose max-w-none">
        <p class="text-gray-400 text-sm">預覽區域 — 輸入 Markdown 後按「即時預覽」</p>
      </div>
    </div>

  </div>
</main>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 bg-gray-800 text-white px-5 py-3 rounded-lg shadow-lg text-sm transition-all translate-y-20 opacity-0 pointer-events-none z-50"></div>

<script>
(function () {
  var mdInput = document.getElementById('md-input');
  var fileInput = document.getElementById('file-input');
  var dropZone = document.getElementById('drop-zone');
  var fileNameEl = document.getElementById('file-name');
  var previewArea = document.getElementById('preview-area');
  var btnPreview = document.getElementById('btn-preview');
  var btnExport = document.getElementById('btn-export');
  var btnClear = document.getElementById('btn-clear');
  var toastEl = document.getElementById('toast');

  var uploadedFileName = '';

  // --- Toast ---
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('translate-y-20', 'opacity-0');
    setTimeout(function () {
      toastEl.classList.add('translate-y-20', 'opacity-0');
    }, 2500);
  }

  // --- File handling ---
  function handleFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      mdInput.value = e.target.result;
      uploadedFileName = file.name.replace(/\.[^.]+$/, '');
      fileNameEl.textContent = '已載入: ' + file.name;
      fileNameEl.classList.remove('hidden');
      showToast('檔案已載入');
    };
    reader.readAsText(file, 'UTF-8');
  }

  dropZone.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { handleFile(fileInput.files[0]); });

  dropZone.addEventListener('dragover', function (e) {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', function () {
    dropZone.classList.remove('dragover');
  });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    var files = e.dataTransfer.files;
    if (files.length > 0) handleFile(files[0]);
  });

  // --- Clear ---
  btnClear.addEventListener('click', function () {
    mdInput.value = '';
    previewArea.innerHTML = '<p class="text-gray-400 text-sm">預覽區域 — 輸入 Markdown 後按「即時預覽」</p>';
    fileNameEl.classList.add('hidden');
    uploadedFileName = '';
  });

  // --- Markdown → HTML (with Mermaid detection) ---
  function convertMarkdown(src) {
    var html = marked.parse(src);
    // Convert <pre><code class="language-mermaid">...</code></pre> → <pre class="mermaid">...</pre>
    html = html.replace(
      /<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
      function (match, inner) {
        // Decode HTML entities back for Mermaid
        var decoded = inner
          .replace(/&amp;/g, '&')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'");
        return '<pre class="mermaid">' + decoded + '</pre>';
      }
    );
    return html;
  }

  // --- Preview ---
  btnPreview.addEventListener('click', function () {
    var src = mdInput.value.trim();
    if (!src) {
      showToast('請先輸入 Markdown 內容');
      return;
    }
    var html = convertMarkdown(src);
    previewArea.innerHTML = html;

    // Render Mermaid diagrams in preview
    if (window.__mermaid) {
      window.__mermaid.run({ nodes: previewArea.querySelectorAll('.mermaid') });
    }
  });

  // --- Export ---
  btnExport.addEventListener('click', function () {
    var src = mdInput.value.trim();
    if (!src) {
      showToast('請先輸入 Markdown 內容');
      return;
    }
    var bodyHTML = convertMarkdown(src);
    var title = uploadedFileName || 'markdown-export';

    var fullHTML = [
      '<!DOCTYPE html>',
      '<html lang="zh-TW">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
      '<title>' + escapeHTML(title) + '</title>',
      '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">',
      '<style>',
      '  body { max-width: 980px; margin: 0 auto; padding: 2rem 1rem; }',
      '  .markdown-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }',
      '  .mermaid { text-align: center; margin: 1.5em 0; }',
      '  @media print { body { padding: 0; } }',
      '</style>',
      '</head>',
      '<body class="markdown-body">',
      bodyHTML,
      '<script type="module">',
      "  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';",
      '  mermaid.initialize({ startOnLoad: true, theme: "default" });',
      '<\/script>',
      '</body>',
      '</html>'
    ].join('\n');

    var blob = new Blob([fullHTML], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = title + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已匯出 ' + title + '.html');
  });

  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>

</body>
</html>
